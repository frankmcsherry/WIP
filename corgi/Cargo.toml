[package]
name = "corgi"
version = "0.1.0"
edition = "2021"

[dependencies]
# optional: `Shape` (de)serializes, so a host can carry corgi types inside its own serialized IR.
serde = { version = "1", features = ["derive"], optional = true }

[features]
# time per op kind over a run (`corgi::explain::profile`); off, it costs nothing.
profile = []

[[bench]]
name = "eval"
harness = false   # plain `fn main()` timing — no framework, no dependency

[[bench]]
name = "gaps"
harness = false   # the perf-gap suite (corgi vs hand-written-Rust ceiling); see benches/gaps.rs

[[bench]]
name = "idioms"
harness = false   # idiomatic corgi against idiomatic Rust; the rows of performance.md gaps.rs does not measure

[[bench]]
name = "algorithms"
path = "benches/algorithms/main.rs"
harness = false   # algorithms written as a user would, checked and timed against plain Rust

[[bench]]
name = "clickbench"
path = "benches/clickbench/main.rs"
harness = false   # ClickBench queries in corgi, checked against DuckDB's answers (see prepare.py)

[[bench]]
name = "tpch"
path = "benches/tpch/main.rs"
harness = false   # TPC-H queries (joins) in corgi, checked against DuckDB's answers (see prepare.py)

[[bench]]
name = "fold"
harness = false   # Fold/FoldScan per-element cost across row-length regimes, plus Jaro-Winkler
