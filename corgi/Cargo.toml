[package]
name = "corgi"
version = "0.1.0"
edition = "2021"

[dependencies]
# optional: `Shape` (de)serializes, so a host can carry corgi types inside its own serialized IR.
serde = { version = "1", features = ["derive"], optional = true }

[[bench]]
name = "eval"
harness = false   # plain `fn main()` timing — no framework, no dependency

[[bench]]
name = "gaps"
harness = false   # the perf-gap suite (corgi vs hand-written-Rust ceiling); see benches/gaps.rs

[[bench]]
name = "stride"
harness = false   # stride-detection spike: ragged vs dense sort of uniform-width keys
